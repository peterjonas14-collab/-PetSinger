<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b12"><title>PetSinger</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:28px 20px;background:radial-gradient(circle at 50% 0,#30204f,#0b0b12 42%)}.logo{font-weight:900;font-size:30px}.sub{color:#aaa}.card{margin-top:22px;padding:18px;border:1px solid #302d3c;border-radius:24px;background:#15141d}h1{font-size:34px}.label{font-size:13px;color:#aaa;margin:18px 0 7px}input,select,textarea{width:100%;background:#0e0d14;border:1px solid #383441;color:#fff;border-radius:14px;padding:13px;font-size:16px}button{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:800;margin-top:14px;background:linear-gradient(90deg,#9b5cff,#ff4fcf);color:#fff}.secondary{background:#24212e}.hidden{display:none}.preview,video{width:100%;border-radius:20px;margin-top:12px;max-height:430px;object-fit:cover}.status{padding:14px;border-radius:14px;background:#0f0e15;color:#bbb;margin-top:14px}</style></head><body><div class="app"><div class="logo">🐾 PetSinger</div><div class="sub">Turn your pet into a music star.</div><section id="home" class="card"><h1>Your pet.<br>Your song.</h1><p class="sub">Create an original AI song and turn your pet photo into a music video.</p><button onclick="show('create')">Create my PetSinger</button></section><section id="create" class="card hidden"><h2>Choose your pet</h2><input id="photo" type="file" accept="image/*" onchange="preview(event)"><img id="img" class="preview hidden"><div class="label">Song topic</div><textarea id="prompt" rows="3">I'm the Boss of the House</textarea><div class="label">Music</div><select id="style"><option>Funny upbeat pop</option><option>Pop</option><option>Rock</option><option>Rap</option><option>Country</option><option>EDM</option><option>Emotional</option></select><div class="label">Voice</div><select id="voice"><option>Cute funny vocal</option><option>Deep</option><option>Cartoon</option><option>Pop</option><option>Dramatic</option></select><div class="label">Duration</div><select id="duration"><option value="15">15 seconds</option><option value="30">30 seconds</option></select><button onclick="generate()">Create song & video</button><button class="secondary" onclick="show('home')">Back</button></section><section id="progress" class="card hidden"><h2>Creating your music star… 🎤</h2><div id="status" class="status">Starting…</div></section><section id="result" class="card hidden"><h2>Your PetSinger video 🎬</h2><video id="video" controls playsinline></video><button onclick="shareVideo()">Share video</button><button class="secondary" onclick="show('create')">Make another</button><div id="resultStatus" class="status">Ready!</div></section></div><script>const API="https://petsingerbackend.onrender.com";let currentVideoUrl="";function show(id){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}function preview(e){const f=e.target.files[0];if(!f)return;const i=document.getElementById("img");i.src=URL.createObjectURL(f);i.classList.remove("hidden")}async function generate(){const file=document.getElementById("photo").files[0];if(!file){alert("Please choose your pet photo first.");return}show("progress");const status=document.getElementById("status");const form=new FormData();form.append("pet_image",file);form.append("prompt",document.getElementById("prompt").value);form.append("music_style",document.getElementById("style").value);form.append("voice_style",document.getElementById("voice").value);form.append("duration_sec",document.getElementById("duration").value);try{status.textContent="Generating your song and video…";const r=await fetch(API+"/v1/generate",{method:"POST",body:form});if(!r.ok)throw Error("Backend HTTP "+r.status);const data=await r.json();if(data.video_url)return finish(data.video_url);if(!data.video_id)throw Error("No video_id returned.");await poll(data.video_id)}catch(e){status.textContent="Generation failed: "+e.message}}async function poll(id){const s=document.getElementById("status");for(let i=0;i<120;i++){const r=await fetch(API+"/v1/status/"+encodeURIComponent(id));if(!r.ok)throw Error("Status HTTP "+r.status);const d=await r.json();s.textContent="PetSinger is working… "+(d.status||"processing");const u=d.video_url||d.url;if(u)return finish(u);if(["failed","error","cancelled"].includes(String(d.status||"").toLowerCase()))throw Error(d.error||"Video generation failed");await new Promise(x=>setTimeout(x,5000))}throw Error("Generation timed out")}function finish(u){currentVideoUrl=u;document.getElementById("video").src=u;show("result")}async function shareVideo(){if(navigator.share)await navigator.share({title:"My PetSinger video",url:currentVideoUrl});else{await navigator.clipboard.writeText(currentVideoUrl);alert("Video link copied")}}</script></body></html>
